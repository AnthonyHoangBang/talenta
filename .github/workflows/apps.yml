name: Dong goi app Talenta
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/**']
    paths: ['apps/**', 'icons/**', '.github/workflows/apps.yml']
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: ''
            out: target/release/bundle/nsis/*.exe
            file: Talenta-Windows.exe
          - os: macos-latest
            name: Mac
            args: '--target universal-apple-darwin'
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            file: Talenta-Mac.dmg
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash, working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: npm install
      - run: npx tauri icon ../../icons/icon-1024.png
      - run: npx tauri build ${{ matrix.args }}
      - run: mkdir -p ../../dist && cp src-tauri/${{ matrix.out }} ../../dist/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with: { name: talenta-${{ matrix.name }}, path: dist/${{ matrix.file }} }

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Gan bieu tuong Talenta
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r res/* android/app/src/main/res/
      - run: >
          npx cap build android --androidreleasetype APK
          --keystorepath "$GITHUB_WORKSPACE/apps/android/talenta.keystore"
          --keystorepass talenta-app --keystorealias talenta --keystorealiaspass talenta-app
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | grep -v unsigned | head -1)
          [ -n "$APK" ] || APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "$APK"; cp "$APK" "$GITHUB_WORKSPACE/dist/Talenta-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: talenta-Android, path: dist/Talenta-Android.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Talenta ${{ github.ref_name }}
          files: dist/*
          body: |
            Bản cài Talenta · Nén Bạc.
            - **Windows**: tải `Talenta-Windows.exe`, mở và cài. Nếu Windows báo "Windows protected your PC", bấm **More info → Run anyway**.
            - **Mac**: tải `Talenta-Mac.dmg`, kéo Talenta vào Applications. Lần đầu mở, nhấp chuột phải vào Talenta → **Open → Open**.
            - **Android**: tải `Talenta-Android.apk` trên điện thoại, mở file và cho phép cài từ nguồn này.
            - **iPhone**: mở https://anthonyhoangbang.github.io/talenta/ bằng Safari → nút Chia sẻ → **Thêm vào MH chính**.
